# =====================================================================
#  XXC The Cleaners — global configuration
#  Installed to: /etc/xxc/cleaners.conf
#
#  Every value here can also be overridden on the command line, so the
#  same binary works for ad-hoc use and for autonomous crontab jobs.
#  See `xxc-cleaners --help` and `xxc-cleaners --list`.
#
#  Created by Kawaiipantsu · THUGS(red) · https://thugs.red
# =====================================================================

[global]
# Default "older than" window, in days. Files younger than this are kept.
# Set per-cleaner overrides in the [retention] section below.
retention_days = 14

# Files at or above this size are flagged as "large" in --analyze / TUI.
min_large_file = 100M

# Safety & output defaults (CLI flags take precedence).
dry_run    = false   # when true, never delete — only report
silent     = false   # suppress non-error output (good for cron)
verbose    = false   # timestamped, chatty output
assume_yes = false   # when true, non-interactive runs actually delete

[journal]
# Passed straight to `journalctl --vacuum-size=` / `--vacuum-time=`.
max_size = 500M
max_age  = 30d

[docker]
# Builder cache + dangling images are always offered. These add more:
prune     = false    # `docker system prune -f` (unused containers/nets/dangling)
prune_all = false    # `docker system prune -a -f` (ALSO unused images) — aggressive
                     # Named volumes are NEVER pruned.

# ---------------------------------------------------------------------
# Enable / disable individual cleaners. Absent = enabled.
# Keys come from `xxc-cleaners --list`.
# ---------------------------------------------------------------------
[cleaners]
# tmp           = true
# var-log       = true
# apache-logs   = true
# apt-cache     = true
# journal       = true
# syslog        = true
# docker        = false
# browser-cache = true
# ai-caches     = true
# core-dumps    = true
# user-cache    = true
# root-cache    = true
# pip-cache     = true
# node-cache    = true
# go-build-cache= true

# ---------------------------------------------------------------------
# Per-cleaner retention overrides (days). Fall back to global otherwise.
# ---------------------------------------------------------------------
[retention]
tmp           = 7
browser-cache = 3
ai-caches     = 30
var-log       = 14
core-dumps    = 7

# ---------------------------------------------------------------------
# Protected paths — NEVER touched, no matter what. These extend the
# built-in protections (/, /etc, /boot, databases, docker volumes, …).
# One path per line.
# ---------------------------------------------------------------------
[protect]
/var/lib/mysql
/var/lib/mariadb
/var/lib/postgresql
/var/lib/mongodb
/var/lib/redis
/etc
/srv/important-data
